<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visualisatie tool DWR – drinkwateropgave</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/stijl.css">
</head>
<body>
<div id="stage">
  <!-- Logo: tijdelijk bestand (zie OPEN-VRAGEN I2); vervang door het officiele bestand van Vitens -->
  <h1 id="title" class="abs"><img class="logo" alt="Vitens" src="assets/vitens-logo.png"><span class="sep" aria-hidden="true"></span><span>Visualisatie tool DWR</span></h1>
  <div id="rule" class="abs"></div>
  <div id="sub" class="abs">Weeg combinaties van maatregelen af op impact op de opgave en effecten op gemeenten</div>
  <div id="tools" class="abs"><span id="fouten"></span><span class="badge" id="badge"></span><a class="linkbtn" href="invoer.html">Invoer</a><button class="linkbtn" id="reset" type="button">↺ Reset</button></div>
  <div id="melding" class="abs" hidden></div>

  <!-- SCENARIO -->
  <section id="scen" class="panel" aria-label="Scenario">
    <div id="scenHead" class="abs"><span class="cap">Scenario</span><span class="pill">niet stuurbaar</span></div>
    <div id="scenRows" class="abs" role="radiogroup" aria-label="Narratief"></div>
    <div id="scenKern" class="abs"></div>
  </section>

  <!-- MAATREGELEN -->
  <section id="meas" class="panel" aria-label="Maatregelen">
    <div id="measHead" class="abs"><span class="cap">Maatregelen</span><span class="colh c1">Mm³/j in <span class="yr"></span></span><span class="colh c2">spoor</span></div>
    <div id="measRows" class="abs"></div>
  </section>

  <!-- DRINKWATEROPGAVE -->
  <section id="opg" class="panel" aria-label="Drinkwateropgave">
    <div id="opgHead" class="abs"><span class="cap">Drinkwateropgave</span><span class="chips"><select id="clusterKeuze" aria-label="Toon totaal of één cluster"></select><button class="chip" id="chipRes" type="button" aria-pressed="false" title="Reservenorm: productiecapaciteit = vraag + 10% operationele reserve. Alleen een lijn; geen effect op opgave of dekking.">Reserve +10%</button><button class="chip" id="chipTab" type="button" aria-pressed="false">Tabel</button></span></div>
    <div id="zLabel" class="abs" style="line-height:30px">Zichtjaar</div>
    <input id="zr" class="abs" type="range" min="2025" max="2050" step="1" aria-label="Zichtjaar">
    <div id="zTicks" class="abs"></div>
    <button id="play" class="abs" type="button" aria-label="Speel tijdlijn af"></button>
    <svg id="chart" class="abs" width="594" height="318" viewBox="0 0 594 318" role="img" aria-label="Vraag en aanbod drinkwater 2025–2050">
      <g id="chartG"></g><g id="hoverG" pointer-events="none"></g>
      <rect id="hit" x="70" y="20" width="502" height="270" fill="transparent"/>
    </svg>
    <div id="tableView" class="abs" hidden></div>
    <div id="legend" class="abs"></div>
    <div id="barTitle" class="abs">Invulling drinkwateropgave in <span class="yr"></span></div>
    <div id="bar" class="abs" tabindex="0" aria-label="Invulling drinkwateropgave"><div id="barFill"></div><div id="barL"></div><div id="barR"></div></div>
    <div id="barDetail" class="abs"></div>
  </section>

  <!-- EFFECTEN GEMEENTEN -->
  <section id="eff" class="panel" aria-label="Effecten gemeenten">
    <div id="effIcon" class="abs" aria-hidden="true">
      <svg width="30" height="26" viewBox="0 0 30 26" fill="#fff"><rect x="2" y="9" width="8" height="17" rx="1"/><rect x="11" y="2" width="9" height="24" rx="1"/><rect x="21" y="12" width="7" height="14" rx="1"/><g fill="#4AAFE0"><rect x="4" y="12" width="2" height="2"/><rect x="4" y="16" width="2" height="2"/><rect x="4" y="20" width="2" height="2"/><rect x="13" y="5" width="2" height="2"/><rect x="16" y="5" width="2" height="2"/><rect x="13" y="9" width="2" height="2"/><rect x="16" y="9" width="2" height="2"/><rect x="13" y="13" width="2" height="2"/><rect x="16" y="13" width="2" height="2"/><rect x="13" y="17" width="2" height="2"/><rect x="16" y="17" width="2" height="2"/><rect x="23" y="15" width="2" height="2"/><rect x="23" y="19" width="2" height="2"/></g></svg>
    </div>
    <div id="effTitle" class="abs">Effecten<br>gemeenten</div>
    <div id="effSub" class="abs">bij zichtjaar <span class="yr"></span></div>
    <div id="effChips" class="abs" role="group" aria-label="Toon effecten van"><button class="chip" data-m="maatregelen" type="button" aria-pressed="true" title="Effecten van de ingeschakelde maatregelen">Maatregelen</button><button class="chip" data-m="winningen" type="button" aria-pressed="false" title="Afname van de capaciteit per bestaande winning">Winningen</button></div>
    <svg id="map" class="abs" width="295" height="196" viewBox="0 0 295 196" role="img" aria-label="Schematische kaart"><g id="mapG"></g><g id="pinG"></g></svg>
    <div id="mapLegend" class="abs"></div>
    <ul id="effList" class="abs" aria-live="polite"></ul>
  </section>

  <div id="foot" class="abs"></div>
  <div id="bronregel" class="abs"></div>
</div>
<div id="tip" hidden></div>

<script type="module" src="js/viz/app.js"></script>
</body>
</html>
